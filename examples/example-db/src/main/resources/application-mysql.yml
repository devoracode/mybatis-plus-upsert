spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:33306}/${MYSQL_DATABASE:test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&sslMode=${MYSQL_SSL_MODE:VERIFY_IDENTITY}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  upsert:
    db-type: mysql
    use-new-mysql-syntax: true