spring:
  datasource:
    dynamic:
      primary: mysql
      datasource:
        mysql:
          url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:33306}/${MYSQL_DATABASE:test}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&serverTimezone=GMT%2B8&sslMode=${MYSQL_SSL_MODE:VERIFY_IDENTITY}
          username: ${MYSQL_USERNAME}
          password: ${MYSQL_PASSWORD}
          driver-class-name: com.mysql.cj.jdbc.Driver
        postgresql:
          url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DATABASE:test}?currentSchema=public&sslmode=${POSTGRES_SSL_MODE:verify-full}
          username: ${POSTGRES_USERNAME}
          password: ${POSTGRES_PASSWORD}
          driver-class-name: org.postgresql.Driver