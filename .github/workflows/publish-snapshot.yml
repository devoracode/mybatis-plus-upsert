name: Publish SNAPSHOT

# 不直接跟 push：CI 那条 run 全绿后由 workflow_run 接力，避免把没验过的提交推上快照仓库。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 与 release.yml 共用同一组，避免快照与正式发布并发上传 Central 互相踩
concurrency:
  group: maven-central-publish
  cancel-in-progress: false

jobs:
  # 先读 ${revision}：不是 SNAPSHOT 就整个跳过，绝不把非快照版本推上 Central
  check:
    runs-on: ubuntu-latest
    # workflow_run 的 completed 不分成败，这里只放行 CI 成功的 run；手动触发不受限
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      snapshot: ${{ steps.revision.outputs.snapshot }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify the checked-out commit
        id: commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked out ${ACTUAL_SHA}, expected ${EXPECTED_SHA}."
            exit 1
          fi
          echo "sha=${ACTUAL_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
      - name: Resolve the revision
        id: revision
        run: |
          REV=$(mvn --batch-mode --quiet -DforceStdout help:evaluate -Dexpression=revision)
          echo "revision is ${REV}"
          case "${REV}" in
            *-SNAPSHOT) echo "snapshot=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "snapshot=false" >> "$GITHUB_OUTPUT" ;;
          esac

  publish:
    needs: check
    if: needs.check.outputs.snapshot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
      - name: Verify the checked-out commit
        env:
          EXPECTED_SHA: ${{ needs.check.outputs.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked out ${ACTUAL_SHA}, expected ${EXPECTED_SHA}."
            exit 1
          fi
      - name: Publish SNAPSHOT to Maven Central
        # central-publishing-maven-plugin 0.7.0+ 对 -SNAPSHOT 版本自动路由到快照仓库；
        # Portal 对快照不做校验、可覆盖发布，签名无意义
        run: >
          mvn --batch-mode deploy -DskipTests -Dgpg.skip=true
          -pl .,mybatis-plus-upsert-core,mybatis-plus-upsert-boot-starter,mybatis-plus-upsert-dynamic-datasource-boot-starter
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
